services:
  - type: web
    name: finance-ia
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false        # Você preenche direto no painel do Render (não fica no código)
    healthCheckPath: /api/health
    autoDeploy: true       # Faz deploy automático a cada push no GitHub
